# Last-synced provider connection markers (purple:provider_user /
# purple:provider_key). Sync uses these to detect a manual per-host override
# and to propagate a changed provider user or key to existing hosts.
# Exercises the single_value_marker reader and set_provider_user/key writer.

# Standard markers alongside the provider marker. The `_user`/`_key` suffix
# (no space) must not be swallowed by the `# purple:provider ` parser.
Host do-web
  HostName 1.2.3.4
  User admin
  IdentityFile ~/.ssh/id_ed25519
  # purple:provider digitalocean:382010
  # purple:provider_user admin
  # purple:provider_key ~/.ssh/id_ed25519

# Key path containing spaces must round-trip verbatim.
Host spaced-key
  HostName 1.2.3.5
  User root
  # purple:provider digitalocean:382011
  # purple:provider_key ~/my keys/id_ed25519

# Marker present but host User differs (a manual override): reader still
# returns the marker value; sync compares it against the User directive.
Host overridden
  HostName 1.2.3.6
  User deploy
  # purple:provider digitalocean:382012
  # purple:provider_user root

# Empty marker (no value) must parse as absent, not as an empty string.
Host empty-marker
  HostName 1.2.3.7
  User root
  # purple:provider_user
  # purple:provider_key

# Tab indent (writer must preserve indent style).
Host tab-indent
	HostName 1.2.3.8
	User admin
	# purple:provider_user admin
