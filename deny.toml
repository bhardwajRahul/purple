[advisories]
version = 2
ignore = [
    # rsa: timing sidechannel (no fix available). Purple only uses it for GCP
    # JWT signing, not for private key operations over a network.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# netlink-packet-core defines the NetlinkMessage type that src/tcp_diag.rs
# shares with netlink-packet-sock-diag. Two versions in the tree compile as
# unrelated types and only fail on Linux, so pin the graph to exactly one.
deny = [{ crate = "netlink-packet-core", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
